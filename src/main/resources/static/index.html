<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DateTimeChecker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-sm p-4" style="max-width: 420px; width: 100%;">
        <h1 class="text-center mb-4 text-primary">DateTimeChecker</h1>

        <div class="mb-3">
            <label for="day" class="form-label">Day</label>
            <input type="text" id="day" class="form-control" placeholder="Day">
        </div>

        <div class="mb-3">
            <label for="month" class="form-label">Month</label>
            <input type="text" id="month" class="form-control" placeholder="Month">
        </div>

        <div class="mb-3">
            <label for="year" class="form-label">Year</label>
            <input type="text" id="year" class="form-control" placeholder="Year">
        </div>

        <div class="d-flex gap-2">
            <button id="check" onclick="check()" class="btn btn-primary flex-fill">
                Check
            </button>
            <button id="clear" onclick="clearForm()" class="btn btn-secondary flex-fill">
                Clear
            </button>
        </div>

        <p id="result" class="text-center mt-3 fw-semibold"></p>
    </div>
</div>

<script>
    async function check() {
        const day = document.getElementById("day").value;
        const month = document.getElementById("month").value;
        const year = document.getElementById("year").value;

        const response = await fetch("/api/datetime/check", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ day, month, year })
        });

        const data = await response.json();
        const result = document.getElementById("result");

        result.textContent = data.message;
        result.className = "text-center mt-3 fw-semibold";
        result.style.color = data.valid ? "green" : "red";
    }

    function clearForm() {
        document.getElementById("day").value = "";
        document.getElementById("month").value = "";
        document.getElementById("year").value = "";

        const result = document.getElementById("result");
        result.textContent = "";
        result.className = "text-center mt-3 fw-semibold";
        result.style.color = "";
    }
</script>

</body>

</html>
